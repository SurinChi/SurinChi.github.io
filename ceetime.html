<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏳ 高考倒计时 · SurinChi</title>
    <link rel="icon" href="Assets/images/avatar.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="Assets/videos/nahida.mp4" type="video/mp4">
        您的浏览器不支持视频标签。
    </video>

    <div class="overlay"></div>

    <div class="nav">
        <img class="nav-avatar" src="Assets/images/avatar.png" alt="avatar">
        <button onclick="goHome()">回到主页</button>
    </div>

    <div class="page-container">
        <div class="cee-page">
            <h1>全国普通高考倒计时</h1>
            <div class="sub">6月7日~6月9日</div>

            <div id="status-title">加载中...</div>

            <div class="countdown" id="countdownContainer">
                <div class="time-unit" id="unitDays">
                    <div class="number" id="days">00</div>
                    <span class="label">天</span>
                </div>
                <div class="time-unit" id="unitHours">
                    <div class="number" id="hours">00</div>
                    <span class="label">小时</span>
                </div>
                <div class="time-unit" id="unitMinutes">
                    <div class="number" id="minutes">00</div>
                    <span class="label">分钟</span>
                </div>
                <div class="time-unit" id="unitSeconds">
                    <div class="number" id="seconds">00</div>
                    <span class="label">秒</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 引用外部 JS ====== -->
    <script src="script/ceetime.js"></script>
</body>
</html>
