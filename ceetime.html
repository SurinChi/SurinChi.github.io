<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="实时高考倒计时，自动识别考前、考中、考后三个阶段，标签页标题同步刷新，手机端自适应。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SurinChi">
    <meta property="og:title" content="⏳ 高考倒计时 - SurinChi">
    <meta property="og:description" content="实时高考倒计时，自动识别考前、考中、考后三个阶段，标签页标题同步刷新，手机端自适应。">
    <meta property="og:url" content="https://surinchi.github.io/ceetime.html">
    <meta property="og:image" content="https://surinchi.github.io/Assets/images/avatar.png">
    <meta name="twitter:card" content="summary">
    <title>⏳ 高考倒计时 - SurinChi</title>
    <link rel="icon" href="Assets/images/avatar.png" type="image/x-icon">
    <!-- ====== 引用模块化 CSS ====== -->
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/nav.css">
    <link rel="stylesheet" href="style/ceetime.css">
    <link rel="stylesheet" href="style/responsive.css">
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="Assets/videos/nahida.mp4" type="video/mp4">
        您的浏览器不支持视频标签。
    </video>

    <div class="overlay"></div>

    <div class="nav">
        <img class="nav-avatar" src="Assets/images/avatar.png" alt="avatar">
        <button onclick="goHome()">回到首页</button>
    </div>

    <div class="page-container">
        <div class="cee-page">
            <h1>全国普通高考倒计时</h1>
            <div class="sub">6月7日~6月9日</div>

            <div id="status-title">加载中...</div>

            <div class="countdown" id="countdownContainer">
                <div class="time-unit" id="unitDays">
                    <div class="number" id="days">00</div>
                    <span class="label">天</span>
                </div>
                <div class="time-unit" id="unitHours">
                    <div class="number" id="hours">00</div>
                    <span class="label">小时</span>
                </div>
                <div class="time-unit" id="unitMinutes">
                    <div class="number" id="minutes">00</div>
                    <span class="label">分钟</span>
                </div>
                <div class="time-unit" id="unitSeconds">
                    <div class="number" id="seconds">00</div>
                    <span class="label">秒</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 引用外部 JS ====== -->
    <script src="script/ceetime.js"></script>
</body>
</html>
